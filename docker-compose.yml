# docker-compose.yml — everything you need to run collab-crdt locally.
#
# Common uses:
#   docker compose up -d db redis      # just the infra; run the app with `make run`
#   docker compose up --build          # build + run the whole stack (app on :8080)
#
# The app degrades gracefully: without DATABASE_URL it's in-memory, without REDIS_ADDR
# it's single-instance. Compose wires both so you get the full experience.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: "postgres://collab:collab@db:5432/collab"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8080:8080"

  # A second app instance, off by default. Enable it (docker compose up --scale ... or
  # `--profile multi`) to see cross-pod collaboration via Redis in action. Put a load
  # balancer in front, or just hit each port directly to prove two pods stay in sync.
  app2:
    build: .
    profiles: ["multi"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8081"
      DATABASE_URL: "postgres://collab:collab@db:5432/collab"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8081:8081"

volumes:
  pgdata:
